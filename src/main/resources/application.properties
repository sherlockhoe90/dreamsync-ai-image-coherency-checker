server.port=8080

spring.application.name=dreamsync

spring.datasource.url=jdbc:mysql://localhost:3306/dreamsync?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# DreamSync config
dreamsync.uploads-dir=./uploads
dreamsync.thresholds.hamming-similar=12
dreamsync.thresholds.color-dist=45.0
dreamsync.thresholds.text-levenshtein-threshold=2
